name: Update NFL data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_data.py]
  schedule:
    # Refresh every day after the morning news cycle and again before the
    # evening slate. GitHub Actions cron uses UTC.
    - cron: "30 12,21 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: nfl-data-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy polars
      - run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update NFL player data"
          git pull --rebase origin main
          git push
